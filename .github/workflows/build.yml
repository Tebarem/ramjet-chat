name: build

on:
  push:
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - name: Build the plugin against Ramjet.Api from nuget.org
        run: dotnet build src/chat.csproj -c Release
      - name: Tests
        run: dotnet run --project tests/Chat.Tests -c Release
